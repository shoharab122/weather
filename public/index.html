<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌤️ Weather Station</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      font-family: 'Segoe UI', sans-serif; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 20px;
    }
    
    .container { 
      background: white; 
      border-radius: 20px; 
      padding: 40px; 
      box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
      max-width: 600px; 
      width: 100%; 
    }
    
    h1 { 
      text-align: center; 
      color: #333; 
      margin-bottom: 10px; 
      font-size: 2.5em;
    }
    
    .subtitle {
      text-align: center;
      color: #999;
      font-size: 0.9em;
      margin-bottom: 30px;
    }
    
    .status { 
      text-align: center; 
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: bold;
    }
    
    .status.online { 
      background: #d4edda;
      color: #27ae60;
      border: 2px solid #27ae60;
    }
    
    .status.offline { 
      background: #f8d7da;
      color: #e74c3c;
      border: 2px solid #e74c3c;
    }
    
    .grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 20px; 
      margin-bottom: 20px;
    }
    
    .card { 
      color: white; 
      padding: 30px; 
      border-radius: 15px; 
      text-align: center;
    }
    
    .card.temp { 
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); 
    }
    
    .card.humid { 
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); 
    }
    
    .card h3 { 
      font-size: 0.9em; 
      opacity: 0.9; 
      margin-bottom: 10px; 
      text-transform: uppercase; 
    }
    
    .card .value { 
      font-size: 3em; 
      font-weight: bold;
    }
    
    .stats {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 15px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .stat-item {
      text-align: center;
      padding: 15px;
      background: white;
      border-radius: 10px;
    }
    
    .stat-label {
      font-size: 0.8em;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    
    .stat-value {
      font-size: 1.8em;
      font-weight: bold;
      color: #667eea;
    }
    
    .updates {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 15px;
      max-height: 300px;
      overflow-y: auto;
    }
    
    .updates h3 {
      color: #333;
      margin-bottom: 15px;
      font-size: 1em;
    }
    
    .update-item {
      padding: 12px;
      background: white;
      border-left: 4px solid #667eea;
      margin-bottom: 10px;
      border-radius: 5px;
      font-size: 0.9em;
    }
    
    .update-time {
      color: #999;
      font-size: 0.85em;
    }
    
    .update-value {
      color: #333;
      font-weight: bold;
      margin-top: 4px;
    }
    
    @media (max-width: 600px) {
      .container { padding: 20px; }
      h1 { font-size: 1.8em; }
      .card .value { font-size: 2.2em; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌤️ Weather Station</h1>
    <div class="subtitle">LocalHost • No Internet</div>
    
    <div class="status" id="status">⏳ Loading...</div>
    
    <div class="grid">
      <div class="card temp">
        <h3>Temperature</h3>
        <div class="value"><span id="temp">--</span>°C</div>
      </div>
      <div class="card humid">
        <h3>Humidity</h3>
        <div class="value"><span id="humidity">--</span>%</div>
      </div>
    </div>
    
    <div class="stats">
      <div class="stat-item">
        <div class="stat-label">Max</div>
        <div class="stat-value" id="maxTemp">--°C</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Min</div>
        <div class="stat-value" id="minTemp">--°C</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Avg Temp</div>
        <div class="stat-value" id="avgTemp">--°C</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Avg Humidity</div>
        <div class="stat-value" id="avgHumid">--%</div>
      </div>
    </div>
    
    <div class="updates">
      <h3>📊 Latest Updates</h3>
      <div id="updatesList">
        <div class="update-item">Waiting for ESP32 data...</div>
      </div>
    </div>
  </div>

  <script>
    async function fetchLatest() {
      try {
        const res = await fetch('/api/weather/latest');
        const data = await res.json();
        
        if (data.temperature !== undefined) {
          document.getElementById('temp').textContent = data.temperature.toFixed(1);
          document.getElementById('humidity').textContent = Math.round(data.humidity);
          
          const time = new Date(data.created_at);
          const timeStr = time.toLocaleTimeString();
          document.getElementById('status').textContent = `✅ Connected • Last: ${timeStr}`;
          document.getElementById('status').className = 'status online';
          
          const list = document.getElementById('updatesList');
          if (list.children[0].textContent.includes('Waiting')) {
            list.innerHTML = '';
          }
          
          const item = document.createElement('div');
          item.className = 'update-item';
          item.innerHTML = `
            <div class="update-time">${timeStr}</div>
            <div class="update-value">🌡️ ${data.temperature.toFixed(1)}°C | 💧 ${Math.round(data.humidity)}%</div>
          `;
          list.insertBefore(item, list.firstChild);
          
          while (list.children.length > 20) {
            list.removeChild(list.lastChild);
          }
        }
      } catch (err) {
        document.getElementById('status').textContent = '❌ Waiting for ESP32...';
        document.getElementById('status').className = 'status offline';
      }
    }
    
    async function fetchStats() {
      try {
        const res = await fetch('/api/weather/stats');
        const data = await res.json();
        
        if (data.count > 0) {
          document.getElementById('maxTemp').textContent = data.max_temp.toFixed(1) + '°C';
          document.getElementById('minTemp').textContent = data.min_temp.toFixed(1) + '°C';
          document.getElementById('avgTemp').textContent = data.avg_temp.toFixed(1) + '°C';
          document.getElementById('avgHumid').textContent = Math.round(data.avg_humidity) + '%';
        }
      } catch (err) {
        console.error(err);
      }
    }
    
    fetchLatest();
    fetchStats();
    setInterval(() => {
      fetchLatest();
      fetchStats();
    }, 5000);
  </script>
</body>
</html>
